[project]
name = "raindrops-on-roses"  # name for folder, repo, pypi, and install
version = "0.1.0.20260826"
description = "Raindrops on roses (and whiskers on kittens) - Collection of 'a few of my favourite things' -i.e. classes and functions- in order to stop repeating myself"
readme = "README.md"
authors = [ { name = "Dutcho" } ]
requires-python = ">=3.12"
dependencies = [
    "more-more-itertools",
]

[build-system]
requires = ["uv_build<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "favs"  # name for subfolder and and import
